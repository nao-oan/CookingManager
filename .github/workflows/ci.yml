name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があれば、走っている実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint / 型チェック / テスト / ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: Node.js のセットアップ
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      - name: 単体テスト
        run: npm test

      - name: 整形の確認
        run: npm run format:check

      - name: ビルド
        run: npm run build
