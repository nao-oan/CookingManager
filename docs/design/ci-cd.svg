<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
  <title id="title">CookingManager の CI/CD とテスト</title>
  <desc id="desc">ローカル開発から本番デプロイまでの流れ、GitHub Actions の2ジョブ、単体テスト、E2E、手動検証の内訳を示す。</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#416643" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9972e" />
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #1e2b21; }
      .title { font-size: 30px; font-weight: 750; }
      .subtitle { font-size: 15px; fill: #5c6b5e; }
      .section-number { font-size: 14px; font-weight: 750; fill: #fefdf9; }
      .section-title { font-size: 22px; font-weight: 750; }
      .card-title { font-size: 17px; font-weight: 750; }
      .body { font-size: 14px; }
      .small { font-size: 13px; fill: #5c6b5e; }
      .metric { font-size: 23px; font-weight: 750; fill: #416643; }
      .inverse { fill: #fefdf9; }
      .line { stroke: #e4eadf; stroke-width: 1.5; }
      .flow-arrow { stroke: #416643; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .needs-arrow { stroke: #c9972e; stroke-width: 3; fill: none; marker-end: url(#arrow-warn); }
    </style>
  </defs>

  <rect width="1200" height="1160" fill="#fefdf9" />
  <text x="32" y="45" class="title">CookingManager の CI/CD とテスト</text>
  <text x="32" y="72" class="subtitle">変更が本番へ届くまでと、各段階で何を守るか</text>

  <!-- 1. 開発から本番までの流れ -->
  <circle cx="43" cy="111" r="17" fill="#416643" />
  <text x="43" y="116" text-anchor="middle" class="section-number">1</text>
  <text x="70" y="118" class="section-title">開発から本番までの流れ</text>

  <rect x="24" y="142" width="172" height="102" rx="16" fill="#f2f8ee" stroke="#416643" stroke-width="2" />
  <text x="110" y="174" text-anchor="middle" class="card-title">ローカル</text>
  <text x="110" y="199" text-anchor="middle" class="body">開発・手元で確認</text>
  <text x="110" y="222" text-anchor="middle" class="small">npm run dev / test</text>

  <path d="M 201 193 H 216" class="flow-arrow" />
  <rect x="220" y="142" width="172" height="102" rx="16" fill="#ffffff" stroke="#416643" stroke-width="2" />
  <text x="306" y="174" text-anchor="middle" class="card-title">Pull Request</text>
  <text x="306" y="199" text-anchor="middle" class="body">変更をレビュー</text>
  <text x="306" y="222" text-anchor="middle" class="small">CI / Preview を開始</text>

  <path d="M 397 193 H 412" class="flow-arrow" />
  <rect x="416" y="142" width="172" height="102" rx="16" fill="#fef9e9" stroke="#c9972e" stroke-width="2" />
  <text x="502" y="174" text-anchor="middle" class="card-title">GitHub Actions</text>
  <text x="502" y="199" text-anchor="middle" class="body">verify → e2e</text>
  <text x="502" y="222" text-anchor="middle" class="small">品質ゲート</text>

  <path d="M 593 193 H 608" class="flow-arrow" />
  <rect x="612" y="142" width="172" height="102" rx="16" fill="#f2f8ee" stroke="#416643" stroke-width="2" />
  <text x="698" y="174" text-anchor="middle" class="card-title">Vercel Preview</text>
  <text x="698" y="199" text-anchor="middle" class="body">PR の確認環境</text>
  <text x="698" y="222" text-anchor="middle" class="small">マージ前に確認</text>

  <path d="M 789 193 H 804" class="flow-arrow" />
  <rect x="808" y="142" width="172" height="102" rx="16" fill="#ffffff" stroke="#416643" stroke-width="2" />
  <text x="894" y="174" text-anchor="middle" class="card-title">main へマージ</text>
  <text x="894" y="199" text-anchor="middle" class="body">main への push</text>
  <text x="894" y="222" text-anchor="middle" class="small">CI を再実行</text>

  <path d="M 985 193 H 1000" class="flow-arrow" />
  <rect x="1004" y="142" width="172" height="102" rx="16" fill="#416643" />
  <text x="1090" y="174" text-anchor="middle" class="card-title inverse">Vercel Production</text>
  <text x="1090" y="199" text-anchor="middle" class="body inverse">本番へ自動デプロイ</text>
  <text x="1090" y="222" text-anchor="middle" class="small inverse">本番 Supabase</text>

  <!-- 2. GitHub Actions -->
  <rect x="24" y="282" width="1152" height="376" rx="22" fill="#f2f8ee" />
  <circle cx="51" cy="320" r="17" fill="#416643" />
  <text x="51" y="325" text-anchor="middle" class="section-number">2</text>
  <text x="78" y="327" class="section-title">GitHub Actions の中身</text>
  <text x="1148" y="325" text-anchor="end" class="small">PR と main への push で実行</text>

  <rect x="48" y="354" width="492" height="270" rx="18" fill="#ffffff" stroke="#416643" stroke-width="2" />
  <rect x="48" y="354" width="492" height="54" rx="18" fill="#416643" />
  <rect x="48" y="390" width="492" height="18" fill="#416643" />
  <text x="72" y="388" class="card-title inverse">Job 1　verify</text>
  <text x="516" y="388" text-anchor="end" class="body inverse">上限 15分</text>
  <text x="72" y="438" class="body">1. チェックアウト</text>
  <text x="72" y="467" class="body">2. Node.js 24 をセットアップ</text>
  <text x="72" y="496" class="body">3. npm ci</text>
  <text x="72" y="525" class="body">4. Lint　　5. 型チェック</text>
  <text x="72" y="554" class="body">6. 単体テスト　　7. 整形確認</text>
  <text x="72" y="583" class="body">8. ビルド</text>
  <line x1="72" y1="598" x2="516" y2="598" class="line" />
  <text x="72" y="617" class="small">コード品質・型・ロジック・整形・本番ビルドを確認</text>

  <path d="M 548 489 H 638" class="needs-arrow" />
  <rect x="565" y="445" width="56" height="24" rx="12" fill="#fef9e9" stroke="#c9972e" />
  <text x="593" y="462" text-anchor="middle" class="small">needs</text>

  <rect x="646" y="354" width="506" height="270" rx="18" fill="#ffffff" stroke="#c9972e" stroke-width="2" />
  <rect x="646" y="354" width="506" height="54" rx="18" fill="#c9972e" />
  <rect x="646" y="390" width="506" height="18" fill="#c9972e" />
  <text x="670" y="388" class="card-title inverse">Job 2　e2e</text>
  <text x="1128" y="388" text-anchor="end" class="body inverse">上限 20分</text>
  <text x="670" y="438" class="body">1. チェックアウト / Node.js 24</text>
  <text x="670" y="467" class="body">2. npm ci</text>
  <text x="670" y="496" class="body">3. 5シークレットを確認</text>
  <text x="670" y="525" class="body">4. Chromium / WebKit をインストール</text>
  <text x="670" y="554" class="body">5. ビルド → サーバー起動 → E2E</text>
  <text x="670" y="583" class="body">6. 失敗時だけレポートを7日保存</text>
  <line x1="670" y1="598" x2="1128" y2="598" class="line" />
  <text x="670" y="617" class="small">verify 成功後、開発用 Supabase に対して直列実行</text>

  <!-- 3. テストの内訳 -->
  <circle cx="43" cy="709" r="17" fill="#416643" />
  <text x="43" y="714" text-anchor="middle" class="section-number">3</text>
  <text x="70" y="716" class="section-title">テストの内訳</text>
  <text x="1168" y="714" text-anchor="end" class="small">2026-09-22 の列挙結果</text>

  <rect x="24" y="744" width="360" height="354" rx="20" fill="#f2f8ee" stroke="#416643" stroke-width="2" />
  <text x="48" y="781" class="card-title">単体テスト　Vitest</text>
  <text x="48" y="821" class="metric">99件 / 8ファイル</text>
  <line x1="48" y1="841" x2="360" y2="841" class="line" />
  <text x="48" y="873" class="body">対象</text>
  <text x="48" y="897" class="small">domain：提案・単位換算・期限判定・絵文字</text>
  <text x="48" y="920" class="small">lib：日付・SQL 補助関数</text>
  <text x="48" y="943" class="small">性能：レシピ200 / 在庫100を1秒以内</text>
  <rect x="48" y="972" width="312" height="92" rx="12" fill="#ffffff" />
  <text x="64" y="999" class="body">守るもの</text>
  <text x="64" y="1023" class="small">提案結果、換算、期限判定、日付処理を</text>
  <text x="64" y="1046" class="small">DB なしで素早く検証する</text>

  <rect x="420" y="744" width="360" height="354" rx="20" fill="#fef9e9" stroke="#c9972e" stroke-width="2" />
  <text x="444" y="781" class="card-title">E2E　Playwright</text>
  <text x="444" y="821" class="metric">16 × 2 = 32 tests</text>
  <line x1="444" y1="841" x2="756" y2="841" class="line" />
  <text x="444" y="873" class="body">7ファイル / workers: 1</text>
  <text x="444" y="897" class="small">主要導線 5シナリオ</text>
  <text x="444" y="920" class="small">非機能要件 7シナリオ</text>
  <text x="444" y="943" class="small">パスワード再設定 4シナリオ</text>
  <rect x="444" y="972" width="312" height="92" rx="12" fill="#ffffff" />
  <text x="460" y="999" class="body">守るもの</text>
  <text x="460" y="1023" class="small">主要操作、モバイル表示、操作性、認可、</text>
  <text x="460" y="1046" class="small">復旧導線を Chromium / WebKit で検証する</text>

  <rect x="816" y="744" width="360" height="354" rx="20" fill="#fdf2ef" stroke="#e26354" stroke-width="2" />
  <text x="840" y="781" class="card-title">実 DB を使った手動検証</text>
  <text x="840" y="821" class="metric">自動化の外側</text>
  <line x1="840" y1="841" x2="1152" y2="841" class="line" />
  <text x="840" y="873" class="body">開発用 Supabase で確認</text>
  <text x="840" y="897" class="small">実データで提案速度を計測（NFR-2）</text>
  <text x="840" y="920" class="small">Chrome / Safari / Edge を実機確認</text>
  <text x="840" y="943" class="small">（NFR-16）</text>
  <rect x="840" y="972" width="312" height="92" rx="12" fill="#ffffff" />
  <text x="856" y="999" class="body">守るもの</text>
  <text x="856" y="1023" class="small">実環境に固有の接続・性能・ブラウザ差を</text>
  <text x="856" y="1046" class="small">人の目と操作で補完する</text>

  <text x="24" y="1134" class="small">計測コマンド: npx vitest run / npx playwright test --list　　E2E は同じテストアカウントを直列で共有</text>
</svg>
