<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>R-3 レシピ新規作成 | CookingManager</title>
<link rel="stylesheet" href="styles.css">
<style>
.r-3-content { gap: 12px; }
.r-3-name { display: grid; grid-template-columns: 1fr 110px; gap: 14px; align-items: center; }
.r-3-upload { height: 112px; border: 1.5px dashed var(--ink-weak); border-radius: var(--r-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--green); font-weight: 700; font-size: 12px; }
.r-3-upload .thumb { width: 64px; height: 54px; font-size: 27px; }
.r-3-section { padding: 14px; }
.r-3-ingredient { background: var(--mint); border-radius: var(--r-sm); padding: 10px; }
.r-3-fields { display: grid; grid-template-columns: 1fr 64px 72px 24px; gap: 7px; align-items: center; }
.r-3-fields .input { min-height: 42px; padding: 0 9px; }
.r-3-add { min-height: 46px; border-style: dashed; }
.r-3-step { display: grid; grid-template-columns: 30px 1fr 24px; gap: 8px; align-items: center; }
.r-3-step__num { width: 28px; height: 28px; border-radius: 999px; background: var(--danger-bg); color: var(--danger); display: grid; place-items: center; font-weight: 700; }
.r-3-textarea { min-height: 76px; align-items: flex-start; padding-top: 12px; }
</style>
</head>
<body>
<div class="phone has-tabbar">
  <header class="subbar">
    <svg class="subbar__back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    <div class="subbar__title">新しいレシピ</div><span></span>
  </header>
  <main class="content r-3-content">
    <section class="card r-3-name">
      <div class="field"><label class="section-title">料理名</label><div class="input input--placeholder">料理名を入力</div></div>
      <div class="r-3-upload"><div class="thumb">📷</div>写真を追加</div>
    </section>

    <section class="card stack r-3-section">
      <div class="section-head"><h2 class="page-title">🧺 材料</h2><span class="badge badge--danger">必須・1件以上</span></div>
      <div class="stack r-3-ingredient">
        <div class="r-3-fields">
          <div class="input input--search row--between"><span>鶏もも肉</span><span>⌕</span></div>
          <div class="input">200</div><div class="input input--select"><span>g</span><span>⌄</span></div><span>🗑</span>
        </div>
        <p class="badge">🌿 候補がない場合は新規登録</p>
      </div>
      <button class="btn btn--outline r-3-add">＋ 材料を追加</button>
    </section>

    <section class="card stack r-3-section">
      <h2 class="page-title">👨‍🍳 作り方</h2>
      <div class="r-3-step"><span class="r-3-step__num">1</span><div class="input r-3-textarea">鶏もも肉を一口大に切る</div><span>🗑</span></div>
      <button class="btn btn--outline r-3-add">＋ 手順を追加</button>
    </section>

    <section class="card stack r-3-section">
      <h2 class="page-title">▣ メモ</h2>
      <div class="input input--placeholder r-3-textarea">コツや補足を入力</div>
    </section>
    <button class="btn">▣ レシピを保存</button>
  </main>
  <nav class="tabbar">
    <div class="tab"><svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.3.3.5.7.5 1.1h6c0-.4.2-.8.5-1.1A6 6 0 0 0 12 3z"/></svg>提案</div>
    <div class="tab tab--active"><svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>レシピ</div>
    <div class="tab"><svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 10h14M8.5 6.5v1.5M8.5 13v2"/></svg>冷蔵庫</div>
    <div class="tab"><svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4"/></svg>記録</div>
  </nav>
</div>
</body>
</html>
