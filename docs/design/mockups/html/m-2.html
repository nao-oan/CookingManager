<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=390, initial-scale=1"><title>M-2 日別記録 | CookingManager</title><link rel="stylesheet" href="styles.css">
<style>
.m2-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px;font-size:12px}.m2-date{display:flex;flex-direction:column;gap:4px;align-items:center}.m2-date b{font-size:16px;font-weight:500}.m2-date--active b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:white}.m2-date--active{color:var(--green)}.m2-date--sat{color:#2760b2}.m2-date--sun{color:var(--danger)}
.m2-section{padding:10px;border-radius:var(--r-md);display:flex;flex-direction:column;gap:6px}.m2-section--breakfast,.m2-section--snack{background:var(--danger-bg)}.m2-section--lunch{background:var(--warn-bg)}.m2-section--dinner{background:var(--mint)}.m2-section__head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}.m2-section__title{font-family:'Zen Maru Gothic',sans-serif;font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}.m2-add{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:27px}.m2-section--breakfast .m2-add,.m2-section--snack .m2-add{background:var(--danger)}.m2-section--lunch .m2-add{background:var(--warn)}
.m2-item{background:white;border-radius:var(--r-sm);min-height:56px;padding:6px 10px;display:flex;align-items:center;gap:10px}.m2-item .thumb{width:70px;height:50px;font-size:28px}.m2-item__name{font-size:14px;font-weight:700;line-height:1.35}.m2-edit{margin-left:auto;color:var(--ink-mid)}.m2-empty{background:#fff;border-radius:var(--r-sm);padding:12px;text-align:center}.m2-empty__icon{font-size:28px;opacity:.35}.m2-empty p{font-size:13px;color:var(--ink-mid);margin:4px 0 7px}.m2-empty .btn{max-width:220px;margin:auto;min-height:38px;font-size:14px}
</style></head><body><div class="phone has-tabbar">
<header class="subbar"><span class="subbar__back">‹</span><h1 class="subbar__title">9月21日（月）</h1><span style="font-size:22px;text-align:center">📅</span></header>
<main class="content">
  <div class="m2-week"><div class="m2-date"><span>月</span><b>19</b></div><div class="m2-date"><span>火</span><b>20</b></div><div class="m2-date m2-date--active"><span>水</span><b>21</b></div><div class="m2-date"><span>木</span><b>22</b></div><div class="m2-date"><span>金</span><b>23</b></div><div class="m2-date m2-date--sat"><span>土</span><b>24</b></div><div class="m2-date m2-date--sun"><span>日</span><b>25</b></div></div>
  <section class="m2-section m2-section--breakfast"><div class="m2-section__head"><h2 class="m2-section__title">☀️ 朝食</h2><span class="m2-add">＋</span></div><div class="m2-item"><div class="thumb">🍞</div><div class="m2-item__name">トースト</div><span class="m2-edit">✎</span></div><div class="m2-item"><div class="thumb">🥣</div><div class="m2-item__name">ヨーグルト</div><span class="m2-edit">✎</span></div></section>
  <section class="m2-section m2-section--lunch"><div class="m2-section__head"><h2 class="m2-section__title">☀️ 昼食</h2><span class="m2-add">＋</span></div><div class="m2-item"><div class="thumb">🍲</div><div class="m2-item__name grow">鶏肉ときのこの<br>バターしょうゆ炒め</div><span class="badge">👨‍🍳 レシピ</span><b>›</b></div><div class="m2-item"><div class="thumb">🥣</div><div class="m2-item__name">わかめスープ</div><span class="m2-edit">✎</span></div></section>
  <section class="m2-section m2-section--dinner"><div class="m2-section__head"><h2 class="m2-section__title">🌙 夕食</h2><span class="m2-add">＋</span></div><div class="m2-empty"><div class="m2-empty__icon">🍽️</div><p>まだ記録がありません</p><button class="btn">＋ 夕食を追加</button></div></section>
  <section class="m2-section m2-section--snack"><div class="m2-section__head"><h2 class="m2-section__title">🧁 間食</h2><span class="m2-add">＋</span></div><div class="m2-item"><div class="thumb">🍎</div><div class="m2-item__name">りんご</div><span class="m2-edit">✎</span></div></section>
</main>
<nav class="tabbar"><div class="tab"><span class="tab__icon">⌂</span>提案</div><div class="tab"><span class="tab__icon">⌕</span>レシピ</div><div class="tab"><span class="tab__icon">▣</span>冷蔵庫</div><div class="tab tab--active"><span class="tab__icon">▦</span>記録</div></nav>
</div></body></html>
