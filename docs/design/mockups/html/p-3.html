<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=390, initial-scale=1"><title>P-3 在庫編集 | CookingManager</title><link rel="stylesheet" href="styles.css">
<style>
.p3-content{gap:10px;padding-top:10px}.p3-hero{display:flex;align-items:center;gap:18px;padding:12px 22px}.p3-hero .thumb{width:160px;height:112px;font-size:66px}.p3-heroname{font-family:'Zen Maru Gothic',sans-serif;font-size:25px;font-weight:700}.p3-card{padding:12px}.p3-title{font-family:'Zen Maru Gothic',sans-serif;font-size:19px;font-weight:700}.p3-desc{margin:2px 0 9px}.p3-grid{display:grid;grid-template-columns:1fr .8fr;gap:10px}.p3-date{display:grid;grid-template-columns:1fr auto;gap:8px}.p3-search{justify-content:space-between;font-size:16px}.p3-delete{min-height:58px;flex-direction:column;gap:0}.p3-delete small{font-size:11px;font-weight:400}.p3-gear{font-size:24px;color:var(--green);text-align:center}
</style></head><body>
<div class="phone has-tabbar">
  <header class="subbar"><div class="subbar__back">‹</div><div class="subbar__title">在庫を編集</div><div class="p3-gear">⚙</div><div class="subbar__sub" style="grid-column:1;text-align:left;margin-left:30px;margin-top:-23px">冷蔵庫</div></header>
  <main class="content p3-content">
    <section class="card card--mint p3-hero"><div class="thumb">🥬</div><div class="p3-heroname">ほうれん草</div></section>
    <section class="card p3-card"><div class="p3-title">食材</div><p class="page-lead p3-desc">食材を選び直すことができます。</p><div class="input input--search p3-search"><span>⌕　ほうれん草</span><span>×　｜　<span style="color:var(--green);font-weight:700">変更 ›</span></span></div></section>
    <section class="card p3-card"><div class="p3-title">数量</div><p class="page-lead p3-desc">現在の数量を入力してください。</p><div class="p3-grid"><div class="input">1</div><div class="input input--select"><span>袋</span><span>⌄</span></div></div></section>
    <section class="card p3-card"><div class="p3-title">賞味期限（任意）</div><p class="page-lead p3-desc">賞味期限を設定すると、使い忘れを防げます。</p><div class="p3-date"><div class="input">▣　2026年9月23日</div><button class="btn btn--ghost btn--sm">設定しない</button></div></section>
    <button class="btn">▣　変更を保存</button>
    <button class="btn btn--danger p3-delete"><span>♲　この在庫を削除</span><small>削除前に確認します</small></button>
  </main>
  <nav class="tabbar"><div class="tab"><span class="tab__icon">💡</span>提案</div><div class="tab"><span class="tab__icon">⌕</span>レシピ</div><div class="tab tab--active"><span class="tab__icon">▣</span>冷蔵庫</div><div class="tab"><span class="tab__icon">▤</span>記録</div></nav>
</div></body></html>
