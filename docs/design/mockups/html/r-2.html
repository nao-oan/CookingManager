<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>R-2 レシピ詳細 | CookingManager</title>
<link rel="stylesheet" href="styles.css">
<style>
.r-2-content { gap: 12px; }
.r-2-hero { display: grid; grid-template-columns: 152px 1fr; gap: 12px; align-items: center; }
.r-2-hero .thumb { height: 152px; }
.r-2-recipe-title { font-family: 'Zen Maru Gothic', sans-serif; font-size: 18px; line-height: 1.45; }
.r-2-material { padding: 8px 10px; display: grid; grid-template-columns: 44px 1fr auto auto; gap: 9px; align-items: center; }
.r-2-material .thumb { width: 44px; height: 44px; font-size: 22px; }
.r-2-material__name { font-weight: 700; font-size: 14px; }
.r-2-material__amount { font-size: 14px; font-weight: 500; }
.r-2-step { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
.r-2-step__num { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 999px; background: var(--green); color: white; font-weight: 700; }
.r-2-step p { font-size: 12px; line-height: 1.65; }
</style>
</head>
<body>
<div class="phone has-tabbar">
  <header class="subbar">
    <svg class="subbar__back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    <div class="subbar__title">レシピ詳細</div>
    <svg class="subbar__back" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.8"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10zM13.5 7l3.5 3.5"/></svg>
  </header>
  <main class="content r-2-content">
    <section class="card r-2-hero">
        <div class="thumb thumb--lg">🍲</div>
      <div class="stack">
        <h1 class="r-2-recipe-title">鶏肉ときのこの<br>バターしょうゆ炒め</h1>
        <p class="page-lead">冷蔵庫の食材で、かんたんに作れる定番おかずです。</p>
        <div class="tags"><span class="tag tag--pink">鶏もも肉</span><span class="tag">しめじ</span><span class="tag tag--yellow">ほうれん草</span><span class="tag badge--neutral">バター</span></div>
      </div>
    </section>

    <section class="stack">
      <h2 class="page-title">🧺 材料</h2>
      <div class="card r-2-material"><div class="thumb">🍗</div><span class="r-2-material__name">鶏もも肉</span><span class="r-2-material__amount">200g</span><span class="badge">✓ 在庫あり</span></div>
      <div class="card r-2-material"><div class="thumb">🍄</div><span class="r-2-material__name">しめじ</span><span class="r-2-material__amount">1袋</span><span class="badge">✓ 在庫あり</span></div>
      <div class="card r-2-material"><div class="thumb">🥬</div><span class="r-2-material__name">ほうれん草</span><span class="r-2-material__amount">150g</span><span class="badge badge--warn">! あと50g</span></div>
      <div class="card r-2-material"><div class="thumb">🧈</div><span class="r-2-material__name">バター</span><span class="r-2-material__amount">10g</span><span class="badge badge--neutral">⌂ 常備食材</span></div>
    </section>

    <section class="stack">
      <h2 class="page-title">👨‍🍳 作り方</h2>
      <div class="card r-2-step"><span class="r-2-step__num">1</span><p>鶏もも肉は一口大に切る。しめじは石づきを取り、ほぐす。ほうれん草は3〜4cmの長さに切る。</p></div>
      <div class="card r-2-step"><span class="r-2-step__num">2</span><p>フライパンにバターを熱し、鶏もも肉を焼く。肉の色が変わったら、しめじを加えて炒める。</p></div>
      <div class="card r-2-step"><span class="r-2-step__num">3</span><p>ほうれん草を加えてさっと炒め、しょうゆで味をととのえて完成。</p></div>
    </section>
    <button class="btn">🍴 食べた記録をつける　›</button>
  </main>
  <nav class="tabbar">
    <div class="tab"><svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.3.3.5.7.5 1.1h6c0-.4.2-.8.5-1.1A6 6 0 0 0 12 3z"/></svg>提案</div>
    <div class="tab tab--active"><svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>レシピ</div>
    <div class="tab"><svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 10h14M8.5 6.5v1.5M8.5 13v2"/></svg>冷蔵庫</div>
    <div class="tab"><svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4"/></svg>記録</div>
  </nav>
</div>
</body>
</html>
